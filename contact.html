<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端自适应必备 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XX公司-产品介绍官网</title>
    <!-- Tailwind CDN 在线引入 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 阿里图标库（可选，需要图标再加） -->
    <link
      rel="stylesheet"
      href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
  </head>
  <body>
    <!-- 顶部导航栏 -->
    <header class="bg-slate-800 text-white p-4">
      <div
        class="max-w-7xl mx-auto w-full flex items-center justify-between gap-6"
      >
        <div class="text-xl font-bold">XX科技有限公司</div>
        <div class="flex-1 flex justify-end">
          <div
            class="bg-slate-700 rounded-2xl px-5 py-4 flex flex-col md:flex-row md:items-center gap-6 text-gray-300"
          >
            <div class="flex items-center gap-4">
              <h4 class="text-lg font-bold">快速导航</h4>
              <span class="h-5 w-px bg-white/70"></span>
            </div>
            <div class="flex flex-col md:flex-row md:items-center gap-4">
              <a href="index.html" class="hover:text-white">首页</a>
              <a href="products.html" class="hover:text-white">产品中心</a>
              <a href="about.html" class="hover:text-white">关于我们</a>
              <a href="cooperation.html" class="hover:text-white">合作案例</a>
              <a
                href="contact.html"
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600"
                >立即询价</a
              >
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- 联系与咨询双栏布局 -->
    <section class="py-16 px-8 max-w-7xl mx-auto">
      <div class="grid gap-8 lg:grid-cols-2 lg:items-start">
        <!-- 联系我们 -->
        <div class="text-center lg:text-left p-6 rounded-2xl bg-white">
          <div class="flex justify-center lg:justify-start mb-4">
            <div class="h-1 w-24 bg-blue-500 rounded-full"></div>
          </div>
          <h2 class="text-3xl font-bold mb-6">联系我们或向小润提问</h2>
          <p class="text-gray-600 mb-4">如果您有任何问题或需求，</p>
          <p class="text-gray-600 mb-4">请随时联系我们的客服团队，</p>
          <p class="text-gray-600 mb-4">我们将竭诚为您服务。</p>
          <p class="text-gray-600 mb-4">电话：400-123-4567</p>
          <p class="text-gray-600 mb-4">邮箱：service@xxxcompany.com</p>
          <p class="text-gray-600 mt-0 mb-16">地址：XX市XX产业园</p>
          <div class="flex justify-center lg:justify-start mb-4">
            <div class="h-1 w-24 bg-blue-500 rounded-full"></div>
          </div>
          <h2 class="text-gray-600 mb-4">
            专注智能制造解决方案，赋能企业数字化转型。
          </h2>
          <p class="text-gray-600 mb-4">
            匠心品质，诚信服务，做您身边最可靠的合作伙伴。
          </p>
          <p class="text-gray-600 mb-4">我们将竭诚为您服务。</p>
        </div>

        <!-- 在线咨询 -->
        <div class="text-center lg:text-left p-6 rounded-2xl bg-white">
          <style>
            body {
              background-color: #ffffff;
            }
            .suggest-btn {
              background-color: #f7f7f8;
              color: #333333;
              border-radius: 9999px;
              transition: all 0.24s ease;
              cursor: pointer;
            }
            .suggest-btn:hover {
              background-color: #ebebed;
              box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            }
            .input-box {
              border: 1px solid #b8d8ff;
              border-radius: 16px;
            }
            .input-box:focus {
              outline: none;
              border-color: #60a5fa;
            }
            /* 聊天气泡与思考态样式 */
            #chatContainer .thinking-bubble {
              opacity: 1;
              transition:
                opacity 0.48s ease,
                transform 0.48s ease;
            }
            #chatContainer .reply-bubble {
              opacity: 1;
              transition:
                opacity 0.48s ease,
                transform 0.48s ease;
            }
            /* 简单的省略号动画 */
            @keyframes dots {
              0% {
                content: ".";
              }
              33% {
                content: "..";
              }
              66% {
                content: "...";
              }
              100% {
                content: ".";
              }
            }
            .dots::after {
              display: inline-block;
              width: 1.2em;
              text-align: left;
              animation: dots 1s steps(3, end) infinite;
              content: "...";
              color: rgba(0, 0, 0, 0.5);
              margin-left: 4px;
            }
          </style>
          <div class="max-w-3xl mx-auto w-full flex-1 flex flex-col">
            <div class="flex justify-center lg:justify-start mt-0 mb-0">
              <div class="h-1 w-24 bg-blue-500 rounded-full"></div>
            </div>
            <h1
              class="text-[32px] font-bold text-black text-center lg:text-left mt-2 mb-4"
            >
              小润客服在线咨询
            </h1>

            <div
              class="flex flex-wrap justify-center lg:justify-start gap-[12px] gap-y-[10px] mb-4"
            >
              <div
                class="suggest-btn px-5 py-3"
                data-question="设备是否支持个性化定制？"
              >
                设备是否支持个性化定制？
              </div>
              <div
                class="suggest-btn px-5 py-3"
                data-question="设备质保周期多久？"
              >
                设备质保周期多久？
              </div>
              <div
                class="suggest-btn px-5 py-3"
                data-question="设备交付周期大概多久？"
              >
                设备交付周期大概多久？
              </div>
              <div
                class="suggest-btn px-5 py-3"
                data-question="是否提供上门安装调试？"
              >
                是否提供上门安装调试？
              </div>
              <div
                class="suggest-btn px-5 py-3"
                data-question="设备能否对接工厂MES系统？"
              >
                设备能否对接工厂MES系统？
              </div>
            </div>

            <div
              id="chatContainer"
              class="mt-4 mb-3 h-[280px] overflow-y-auto"
            ></div>

            <div class="mb-2">
              <div class="relative">
                <input
                  id="userInput"
                  type="text"
                  placeholder="发消息或按住空格说话..."
                  class="input-box w-full px-5 py-4 text-lg"
                />
                <button
                  id="sendBtn"
                  class="absolute right-3 top-1/2 -translate-y-1/2 bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600 transition-all"
                >
                  发送
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 底部页脚 -->
    <footer class="bg-slate-900 text-white py-6 px-8 mt-0">
      <div class="text-center mt-0 text-sm text-gray-400">
        ©2026 XX公司 版权所有
      </div>
    </footer>

    <script src="./assets/js/main.js"></script>
  </body>
</html>
